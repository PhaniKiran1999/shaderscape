# Builds a signed release APK on every push to master and publishes it as a GitHub Release.
#
# Needs four secrets in the "Shaderscape" environment (Settings → Environments → Shaderscape →
# Environment secrets), with the SAME values as PAgent's, because both apps must share one key:
#   PAGENT_KEYSTORE_BASE64    the release keystore (.jks), base64-encoded
#   PAGENT_KEYSTORE_PASSWORD  its store password
#   PAGENT_KEY_ALIAS          the key alias inside it
#   PAGENT_KEY_PASSWORD       the key password
name: Release APK

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: false

permissions:
  contents: write # create the release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The signing secrets live in this environment (Settings → Environments → Shaderscape).
    environment: Shaderscape
    env:
      SHADERSCAPE_VERSION_CODE: ${{ github.run_number }}
      SHADERSCAPE_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PAGENT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret PAGENT_KEYSTORE_BASE64 is not set; see the top of this workflow."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "PAGENT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :wallpaper-engine:testDebugUnitTest

      - name: Build the release APK
        env:
          PAGENT_KEYSTORE_PASSWORD: ${{ secrets.PAGENT_KEYSTORE_PASSWORD }}
          PAGENT_KEY_ALIAS: ${{ secrets.PAGENT_KEY_ALIAS }}
          PAGENT_KEY_PASSWORD: ${{ secrets.PAGENT_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Check the signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::No signed APK at $apk (an unsigned build is named app-release-unsigned.apk)."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/Shaderscape-$SHADERSCAPE_VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Shaderscape-${{ env.SHADERSCAPE_VERSION_NAME }}
          path: dist/*.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shaderscape ${{ env.SHADERSCAPE_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body: |
            Built from ${{ github.sha }} by run ${{ github.run_number }}.
            Signed with the same release key as PAgent, so PAgent's release builds can use its wallpaper skill.
          files: dist/*.apk
